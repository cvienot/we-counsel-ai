version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Install Flutter
            - git clone https://github.com/flutter/flutter.git -b stable --depth 1 /tmp/flutter
            - export PATH="$PATH:/tmp/flutter/bin"
            - flutter --version
            - flutter config --no-analytics
            - flutter config --enable-web
            - flutter create . --platforms web
            - flutter precache --web
            - flutter pub get
        build:
          commands:
            - export PATH="$PATH:/tmp/flutter/bin"
            - flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=ENVIRONMENT=$ENVIRONMENT
            - cp build/web/assets/fonts/MaterialIcons-Regular.otf build/web/assets/fonts/MaterialIcons-Regular.ttf
            - perl -0pi -e 's/fonts\/MaterialIcons-Regular\.otf/fonts\/MaterialIcons-Regular.ttf/g' build/web/assets/FontManifest.json build/web/flutter_service_worker.js
      artifacts:
        baseDirectory: build/web
        files:
          - '**/*'
      cache:
        paths:
          - .flutter-plugins
          - .flutter-plugins-dependencies
          - .dart_tool/**/*
