name: Deploy Marketing Site

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/deploy-marketing.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Sync to S3
        run: |
          aws s3 sync marketing/ s3://${{ secrets.MARKETING_S3_BUCKET }}/ \
            --exclude "*.sh" \
            --exclude "*.yaml" \
            --exclude "*.yml" \
            --exclude ".DS_Store" \
            --exclude "README*" \
            --cache-control "public, max-age=86400"

          aws s3 cp marketing/index.html s3://${{ secrets.MARKETING_S3_BUCKET }}/index.html \
            --cache-control "public, max-age=300" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.MARKETING_CLOUDFRONT_ID }} \
            --paths "/*"
