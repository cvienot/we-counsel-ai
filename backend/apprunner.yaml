version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install --production
run:
  runtime-version: 22.14.0
  command: npm start
  network:
    port: 3000
    env: PORT
  env:
    # Non-sensitive configuration (free!)
    - name: NODE_ENV
      value: production
    - name: AWS_REGION
      value: eu-west-3
    - name: DYNAMODB_REGION
      value: eu-west-3
    - name: EMAIL_FROM
      value: camille.vienot@gmail.com  # Update with your verified SES email
    - name: FRONTEND_URL
      value: https://main.d3ct6eeeltgvfr.amplifyapp.com
    
    # Sensitive secrets loaded from AWS Secrets Manager at runtime
    # JWT_SECRET and OPENAI_API_KEY are fetched by src/config/secrets.js
