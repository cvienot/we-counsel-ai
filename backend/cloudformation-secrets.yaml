AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secrets Manager for We Counsel AI - stores all application secrets securely'

Parameters:
  JWTSecret:
    Type: String
    NoEcho: true
    Description: JWT secret for authentication (leave empty to auto-generate)
    Default: ''
  
  OpenAIAPIKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key
  
  AWSAccessKeyId:
    Type: String
    NoEcho: true
    Description: AWS Access Key ID (optional if using IAM roles)
    Default: 'USE_IAM_ROLE'
  
  AWSSecretAccessKey:
    Type: String
    NoEcho: true
    Description: AWS Secret Access Key (optional if using IAM roles)
    Default: 'USE_IAM_ROLE'
  
  EmailFrom:
    Type: String
    Description: Verified SES email address
    Default: 'noreply@example.com'
  
  FrontendURL:
    Type: String
    Description: Frontend URL for CORS
    Default: 'http://localhost:8080'

Conditions:
  GenerateJWTSecret: !Equals [!Ref JWTSecret, '']

Resources:
  # KMS Key for encrypting secrets
  SecretsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for We Counsel AI secrets
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow App Runner to decrypt
            Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: '*'

  SecretsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/we-counsel-secrets
      TargetKeyId: !Ref SecretsKMSKey

  # Main application secrets bundle
  ApplicationSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: we-counsel/application/secrets
      Description: All application secrets for We Counsel AI
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub |
        {
          "JWT_SECRET": "${JWTSecret}",
          "OPENAI_API_KEY": "${OpenAIAPIKey}",
          "AWS_ACCESS_KEY_ID": "${AWSAccessKeyId}",
          "AWS_SECRET_ACCESS_KEY": "${AWSSecretAccessKey}",
          "EMAIL_FROM": "${EmailFrom}",
          "FRONTEND_URL": "${FrontendURL}",
          "AWS_REGION": "eu-west-3",
          "DYNAMODB_REGION": "eu-west-3",
          "NODE_ENV": "production"
        }
      Tags:
        - Key: Application
          Value: WeCounselAI
        - Key: Environment
          Value: Production

  # Separate secret for highly sensitive JWT (optional - for rotation)
  JWTSecretOnly:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: we-counsel/jwt-secret
      Description: JWT signing secret (rotatable)
      KmsKeyId: !Ref SecretsKMSKey
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 64
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      Tags:
        - Key: Application
          Value: WeCounselAI

  # OpenAI API Key as separate secret
  OpenAISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: we-counsel/openai-api-key
      Description: OpenAI API key for AI counselor
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub |
        {
          "OPENAI_API_KEY": "${OpenAIAPIKey}"
        }
      Tags:
        - Key: Application
          Value: WeCounselAI

  # Database credentials (if needed in future)
  DatabaseSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: we-counsel/database/credentials
      Description: Database connection credentials
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub |
        {
          "AWS_ACCESS_KEY_ID": "${AWSAccessKeyId}",
          "AWS_SECRET_ACCESS_KEY": "${AWSSecretAccessKey}",
          "AWS_REGION": "eu-west-3",
          "DYNAMODB_REGION": "eu-west-3"
        }
      Tags:
        - Key: Application
          Value: WeCounselAI

  # IAM Policy for reading secrets
  SecretsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: WeCounselSecretsReadPolicy
      Description: Allows reading We Counsel AI secrets from Secrets Manager
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
            Resource:
              - !Ref ApplicationSecrets
              - !Ref JWTSecretOnly
              - !Ref OpenAISecret
              - !Ref DatabaseSecrets
          - Effect: Allow
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: !GetAtt SecretsKMSKey.Arn

Outputs:
  ApplicationSecretsArn:
    Description: ARN of the main application secrets
    Value: !Ref ApplicationSecrets
    Export:
      Name: WeCounsel-ApplicationSecretsArn
  
  JWTSecretArn:
    Description: ARN of the JWT secret
    Value: !Ref JWTSecretOnly
    Export:
      Name: WeCounsel-JWTSecretArn
  
  OpenAISecretArn:
    Description: ARN of the OpenAI API key secret
    Value: !Ref OpenAISecret
    Export:
      Name: WeCounsel-OpenAISecretArn
  
  DatabaseSecretsArn:
    Description: ARN of the database credentials
    Value: !Ref DatabaseSecrets
    Export:
      Name: WeCounsel-DatabaseSecretsArn
  
  SecretsReadPolicyArn:
    Description: ARN of the IAM policy for reading secrets
    Value: !Ref SecretsReadPolicy
    Export:
      Name: WeCounsel-SecretsReadPolicyArn
  
  KMSKeyId:
    Description: KMS Key ID for encrypting secrets
    Value: !Ref SecretsKMSKey
    Export:
      Name: WeCounsel-SecretsKMSKey
