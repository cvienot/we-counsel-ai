AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secrets Manager for We Coach - stores all application secrets securely'

Parameters:
  JWTSecret:
    Type: String
    NoEcho: true
    Description: JWT secret for authentication (leave empty to auto-generate)
    Default: ''
  
  OpenAIAPIKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key

Conditions:
  GenerateJWTSecret: !Equals [!Ref JWTSecret, '']

Resources:
  # KMS Key for encrypting secrets
  SecretsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for We Coach secrets
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow App Runner to decrypt
            Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: '*'

  SecretsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/we-counsel-secrets
      TargetKeyId: !Ref SecretsKMSKey

  # Sensitive secrets only (JWT + OpenAI)
  ApplicationSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: we-counsel/application/secrets
      Description: Sensitive secrets for We Coach (JWT and OpenAI)
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub |
        {
          "JWT_SECRET": "${JWTSecret}",
          "OPENAI_API_KEY": "${OpenAIAPIKey}"
        }
      Tags:
        - Key: Application
          Value: WeCounselAI
        - Key: Environment
          Value: Production

  # Separate secret for highly sensitive JWT (optional - for rotation)
  JWTSecretOnly:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: we-counsel/jwt-secret
      Description: JWT signing secret (rotatable)
      KmsKeyId: !Ref SecretsKMSKey
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 64
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      Tags:
        - Key: Application
          Value: WeCounselAI



  # IAM Policy for reading secrets
  SecretsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: WeCounselSecretsReadPolicy
      Description: Allows reading We Coach secrets from Secrets Manager
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
            Resource:
              - !Ref ApplicationSecrets
              - !Ref JWTSecretOnly
          - Effect: Allow
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: !GetAtt SecretsKMSKey.Arn

Outputs:
  ApplicationSecretsArn:
    Description: ARN of the main application secrets
    Value: !Ref ApplicationSecrets
    Export:
      Name: WeCounsel-ApplicationSecretsArn
  
  JWTSecretArn:
    Description: ARN of the JWT secret (for rotation)
    Value: !Ref JWTSecretOnly
    Export:
      Name: WeCounsel-JWTSecretArn
  
  SecretsReadPolicyArn:
    Description: ARN of the IAM policy for reading secrets
    Value: !Ref SecretsReadPolicy
    Export:
      Name: WeCounsel-SecretsReadPolicyArn
  
  KMSKeyId:
    Description: KMS Key ID for encrypting secrets
    Value: !Ref SecretsKMSKey
    Export:
      Name: WeCounsel-SecretsKMSKey
