AWSTemplateFormatVersion: '2010-09-09'
Description: 'Launch monitoring, dashboard, and alerts for Entrelace production'

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives launch CloudWatch and budget alerts
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  AppRunnerServiceName:
    Type: String
    Default: we-counsel-backend
    Description: App Runner service name

  MonthlyBudgetUsd:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Monthly AWS budget alert threshold in USD

  FourXxThreshold:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Alarm if App Runner 4xx responses reach this count in 5 minutes

  LatencyThresholdMs:
    Type: Number
    Default: 5000
    MinValue: 1
    Description: Alarm if average request latency reaches this many milliseconds

Resources:
  LaunchAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: we-connect-prod-alerts
      DisplayName: Entrelace production launch alerts
      Tags:
        - Key: Application
          Value: WeConnect
        - Key: Environment
          Value: Production

  LaunchAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref LaunchAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AwsMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: we-connect-prod-monthly-aws-budget
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  Backend5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-apprunner-5xx
      AlarmDescription: App Runner returned at least one 5xx response.
      Namespace: AWS/AppRunner
      MetricName: 5xxStatusResponses
      Dimensions:
        - Name: ServiceName
          Value: !Ref AppRunnerServiceName
        - Name: ServiceID
          Value: !ImportValue WeCounsel-BackendId
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  Backend4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-apprunner-4xx-spike
      AlarmDescription: App Runner 4xx responses spiked above the launch threshold.
      Namespace: AWS/AppRunner
      MetricName: 4xxStatusResponses
      Dimensions:
        - Name: ServiceName
          Value: !Ref AppRunnerServiceName
        - Name: ServiceID
          Value: !ImportValue WeCounsel-BackendId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref FourXxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  BackendLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-apprunner-high-latency
      AlarmDescription: App Runner average request latency is above the launch threshold.
      Namespace: AWS/AppRunner
      MetricName: RequestLatency
      Dimensions:
        - Name: ServiceName
          Value: !Ref AppRunnerServiceName
        - Name: ServiceID
          Value: !ImportValue WeCounsel-BackendId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: !Ref LatencyThresholdMs
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  BackendCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-apprunner-high-cpu
      AlarmDescription: App Runner CPU utilization is sustained above 85 percent.
      Namespace: AWS/AppRunner
      MetricName: CPUUtilization
      Dimensions:
        - Name: ServiceName
          Value: !Ref AppRunnerServiceName
        - Name: ServiceID
          Value: !ImportValue WeCounsel-BackendId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  BackendMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-apprunner-high-memory
      AlarmDescription: App Runner memory utilization is sustained above 85 percent.
      Namespace: AWS/AppRunner
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ServiceName
          Value: !Ref AppRunnerServiceName
        - Name: ServiceID
          Value: !ImportValue WeCounsel-BackendId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  AppRunnerDeploymentFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/service'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-apprunner-service-failures
      FilterPattern: '"Failed"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: AppRunnerServiceFailures
          MetricValue: '1'
          DefaultValue: 0

  AppRunnerDeploymentFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-apprunner-service-failures
      AlarmDescription: App Runner service log contains a failure event.
      Namespace: WeConnect/Launch
      MetricName: AppRunnerServiceFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  ServerErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-server-errors
      FilterPattern: '"Server error"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: ServerErrors
          MetricValue: '1'
          DefaultValue: 0

  WebhookSignatureFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-webhook-signature-failures
      FilterPattern: '"Webhook signature verification failed"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: StripeWebhookSignatureFailures
          MetricValue: '1'
          DefaultValue: 0

  WebhookErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-webhook-errors
      FilterPattern: '"Webhook error"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: StripeWebhookErrors
          MetricValue: '1'
          DefaultValue: 0

  CheckoutErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-checkout-errors
      FilterPattern: '"Error creating checkout session"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: StripeCheckoutErrors
          MetricValue: '1'
          DefaultValue: 0

  PaymentFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-payment-failures
      FilterPattern: '"Payment failed"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: StripePaymentFailures
          MetricValue: '1'
          DefaultValue: 0

  MissingConfigMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-missing-configuration
      FilterPattern: '"Missing required configuration"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: MissingConfigurationErrors
          MetricValue: '1'
          DefaultValue: 0

  MessageSummaryErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-message-summary-errors
      FilterPattern: '"Error generating summary"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: MessageSummaryErrors
          MetricValue: '1'
          DefaultValue: 0

  GetMessagesErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-get-messages-errors
      FilterPattern: '"Get messages error"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: GetMessagesErrors
          MetricValue: '1'
          DefaultValue: 0

  OpenAISummaryErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-openai-summary-errors
      FilterPattern: '"OpenAI summary error"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: OpenAISummaryErrors
          MetricValue: '1'
          DefaultValue: 0

  OpenAIStreamingErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-openai-streaming-errors
      FilterPattern: '"OpenAI Streaming API error"'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: OpenAIStreamingErrors
          MetricValue: '1'
          DefaultValue: 0

  Auth401MetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Fn::Sub:
          - '/aws/apprunner/${ServiceName}/${ServiceId}/application'
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
      FilterName: we-connect-auth-401-responses
      FilterPattern: '[ip, identity, user, timestamp, request, status_code = 401, size, referrer, user_agent]'
      MetricTransformations:
        - MetricNamespace: WeConnect/Launch
          MetricName: Auth401Responses
          MetricValue: '1'
          DefaultValue: 0

  ApplicationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-application-errors
      AlarmDescription: Backend application logged an error matched by launch metric filters.
      Metrics:
        - Id: server_errors
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: ServerErrors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: webhook_signature_failures
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: StripeWebhookSignatureFailures
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: webhook_errors
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: StripeWebhookErrors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: checkout_errors
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: StripeCheckoutErrors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: missing_configuration_errors
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: MissingConfigurationErrors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: message_summary_errors
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: MessageSummaryErrors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: get_messages_errors
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: GetMessagesErrors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: openai_summary_errors
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: OpenAISummaryErrors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: openai_streaming_errors
          MetricStat:
            Metric:
              Namespace: WeConnect/Launch
              MetricName: OpenAIStreamingErrors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: total_errors
          Expression: server_errors + webhook_signature_failures + webhook_errors + checkout_errors + missing_configuration_errors + message_summary_errors + get_messages_errors + openai_summary_errors + openai_streaming_errors
          Label: Total application errors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  StripePaymentFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-stripe-payment-failures
      AlarmDescription: Stripe webhook logged at least one failed payment.
      Namespace: WeConnect/Launch
      MetricName: StripePaymentFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  Auth401SpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-auth-401-spike
      AlarmDescription: Backend access logs show repeated 401 responses.
      Namespace: WeConnect/Launch
      MetricName: Auth401Responses
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  UsersThrottleAlarm:
