    Properties:
      AlarmName: we-connect-prod-dynamodb-users-throttles
      AlarmDescription: DynamoDB users table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !ImportValue WeCounsel-UsersTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  CouplesThrottleAlarm:
