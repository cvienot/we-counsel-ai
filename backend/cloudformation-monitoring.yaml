    Properties:
      AlarmName: we-connect-prod-dynamodb-couples-throttles
      AlarmDescription: DynamoDB couples table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !ImportValue WeCounsel-CouplesTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  InvitationsThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-dynamodb-invitations-throttles
      AlarmDescription: DynamoDB invitations table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !ImportValue WeCounsel-InvitationsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  ConversationsThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-dynamodb-conversations-throttles
      AlarmDescription: DynamoDB conversations table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !ImportValue WeCounsel-ConversationsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  MessagesThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-dynamodb-messages-throttles
      AlarmDescription: DynamoDB messages table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !ImportValue WeCounsel-MessagesTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  SubscriptionsThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-dynamodb-subscriptions-throttles
      AlarmDescription: DynamoDB subscriptions table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !ImportValue WeCounsel-SubscriptionsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  ExercisesThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-dynamodb-exercises-throttles
      AlarmDescription: DynamoDB exercises table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !ImportValue WeCounsel-ExercisesTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  ExerciseSessionsThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-dynamodb-exercise-sessions-throttles
      AlarmDescription: DynamoDB exercise sessions table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !ImportValue WeCounsel-ExerciseSessionsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  SesBounceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-ses-bounces
      AlarmDescription: SES emitted at least one bounce event.
      Namespace: AWS/SES
      MetricName: Bounce
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  SesComplaintAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-ses-complaints
      AlarmDescription: SES emitted at least one complaint event.
      Namespace: AWS/SES
      MetricName: Complaint
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  SesRejectAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: we-connect-prod-ses-rejects
      AlarmDescription: SES emitted at least one reject event.
      Namespace: AWS/SES
      MetricName: Reject
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref LaunchAlertsTopic
      OKActions:
        - !Ref LaunchAlertsTopic

  LaunchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: we-connect-prod-launch
      DashboardBody:
        Fn::Sub:
          - |
            {
              "widgets": [
                {
                  "type": "text",
                  "x": 0,
                  "y": 0,
                  "width": 24,
                  "height": 2,
                  "properties": {
                    "markdown": "# Entrelace Production Launch\\nWatch App Runner traffic/errors, backend application error filters, DynamoDB throttles, SES reputation events, and AWS spend during launch."
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 2,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "App Runner requests and status",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "stacked": false,
                    "stat": "Sum",
                    "period": 60,
                    "metrics": [
                      [ "AWS/AppRunner", "Requests", "ServiceName", "${ServiceName}", "ServiceID", "${ServiceId}", { "label": "Requests" } ],
                      [ "AWS/AppRunner", "4xxStatusResponses", "ServiceName", "${ServiceName}", "ServiceID", "${ServiceId}", { "label": "4xx" } ],
                      [ "AWS/AppRunner", "5xxStatusResponses", "ServiceName", "${ServiceName}", "ServiceID", "${ServiceId}", { "label": "5xx" } ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 2,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "App Runner latency and saturation",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "stacked": false,
                    "period": 60,
                    "metrics": [
                      [ "AWS/AppRunner", "RequestLatency", "ServiceName", "${ServiceName}", "ServiceID", "${ServiceId}", { "stat": "Average", "label": "Latency ms", "yAxis": "left" } ],
                      [ "AWS/AppRunner", "CPUUtilization", "ServiceName", "${ServiceName}", "ServiceID", "${ServiceId}", { "stat": "Average", "label": "CPU %", "yAxis": "right" } ],
                      [ "AWS/AppRunner", "MemoryUtilization", "ServiceName", "${ServiceName}", "ServiceID", "${ServiceId}", { "stat": "Average", "label": "Memory %", "yAxis": "right" } ],
                      [ "AWS/AppRunner", "Concurrency", "ServiceName", "${ServiceName}", "ServiceID", "${ServiceId}", { "stat": "Average", "label": "Concurrency", "yAxis": "left" } ],
                      [ "AWS/AppRunner", "ActiveInstances", "ServiceName", "${ServiceName}", "ServiceID", "${ServiceId}", { "stat": "Average", "label": "Active instances", "yAxis": "left" } ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 8,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "Backend application error filters",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "stacked": false,
                    "stat": "Sum",
                    "period": 300,
                    "metrics": [
                      [ "WeConnect/Launch", "ServerErrors", { "label": "Server errors" } ],
                      [ "WeConnect/Launch", "StripeWebhookSignatureFailures", { "label": "Webhook signature" } ],
                      [ "WeConnect/Launch", "StripeWebhookErrors", { "label": "Webhook errors" } ],
                      [ "WeConnect/Launch", "StripeCheckoutErrors", { "label": "Checkout errors" } ],
                      [ "WeConnect/Launch", "StripePaymentFailures", { "label": "Payment failed" } ],
                      [ "WeConnect/Launch", "MissingConfigurationErrors", { "label": "Missing config" } ],
                      [ "WeConnect/Launch", "OpenAIStreamingErrors", { "label": "OpenAI streaming" } ],
                      [ "WeConnect/Launch", "OpenAISummaryErrors", { "label": "OpenAI summary" } ],
                      [ "WeConnect/Launch", "Auth401Responses", { "label": "401 responses" } ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 8,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "DynamoDB throttled requests",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "stacked": false,
                    "stat": "Sum",
                    "period": 300,
                    "metrics": [
                      [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${UsersTable}", { "label": "Users" } ],
                      [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${CouplesTable}", { "label": "Couples" } ],
                      [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${InvitationsTable}", { "label": "Invitations" } ],
                      [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${ConversationsTable}", { "label": "Conversations" } ],
                      [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${MessagesTable}", { "label": "Messages" } ],
                      [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${SubscriptionsTable}", { "label": "Subscriptions" } ],
                      [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${ExercisesTable}", { "label": "Exercises" } ],
                      [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${ExerciseSessionsTable}", { "label": "Exercise sessions" } ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 14,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "DynamoDB consumed capacity",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "stacked": false,
                    "stat": "Sum",
                    "period": 300,
                    "metrics": [
                      [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${UsersTable}", { "label": "Users read" } ],
                      [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${UsersTable}", { "label": "Users write" } ],
                      [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${MessagesTable}", { "label": "Messages read" } ],
                      [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${MessagesTable}", { "label": "Messages write" } ],
                      [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${ConversationsTable}", { "label": "Conversations read" } ],
                      [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${ConversationsTable}", { "label": "Conversations write" } ]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 14,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "SES transactional email events",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "stacked": false,
                    "stat": "Sum",
                    "period": 3600,
                    "metrics": [
                      [ "AWS/SES", "Send", { "label": "Send" } ],
                      [ "AWS/SES", "Bounce", { "label": "Bounce" } ],
                      [ "AWS/SES", "Complaint", { "label": "Complaint" } ],
                      [ "AWS/SES", "Reject", { "label": "Reject" } ]
                    ]
                  }
                },
                {
                  "type": "log",
                  "x": 0,
                  "y": 20,
                  "width": 24,
                  "height": 6,
                  "properties": {
                    "title": "Recent backend errors",
                    "region": "${AWS::Region}",
                    "query": "SOURCE '/aws/apprunner/${ServiceName}/${ServiceId}/application' | fields @timestamp, @message | filter @message like /error|Error|failed|Failed|Webhook|OpenAI|Stripe/ | sort @timestamp desc | limit 50",
                    "view": "table"
                  }
                }
              ]
            }
          - ServiceName: !Ref AppRunnerServiceName
            ServiceId: !ImportValue WeCounsel-BackendId
            UsersTable: !ImportValue WeCounsel-UsersTable
            CouplesTable: !ImportValue WeCounsel-CouplesTable
            InvitationsTable: !ImportValue WeCounsel-InvitationsTable
            ConversationsTable: !ImportValue WeCounsel-ConversationsTable
            MessagesTable: !ImportValue WeCounsel-MessagesTable
            SubscriptionsTable: !ImportValue WeCounsel-SubscriptionsTable
            ExercisesTable: !ImportValue WeCounsel-ExercisesTable
            ExerciseSessionsTable: !ImportValue WeCounsel-ExerciseSessionsTable

Outputs:
  AlertsTopicArn:
    Description: SNS topic ARN for launch alerts
    Value: !Ref LaunchAlertsTopic
    Export:
      Name: WeConnect-LaunchAlertsTopicArn

  DashboardName:
    Description: CloudWatch dashboard name
    Value: !Ref LaunchDashboard
    Export:
      Name: WeConnect-LaunchDashboardName
